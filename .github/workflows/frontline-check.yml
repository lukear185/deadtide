name: 開放戦場の検査
on:
  push:
    branches: [codex/open-battlefield]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 試作を構築
        run: |
          node <<'JS'
          const fs=require('fs');
          const data=JSON.parse(fs.readFileSync('frontline.patch.json','utf8'));
          let s=fs.readFileSync('index.html','utf8');
          for(const p of data.patches){if(s.split(p.old).length!==2)throw new Error('アンカーが一意でない');s=s.replace(p.old,()=>p.new);}
          fs.writeFileSync('index.html',s);
          JS
      - name: 日本語フォント
        run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - name: 既存版の表示検査を比較
        run: |
          node <<'JS'
          const fs=require('fs'),cp=require('child_process');
          cp.execFileSync('git',['fetch','--depth=1','origin','576ff9c9453bb24505989b51f59b3f13913ac57a'],{stdio:'inherit'});
          const changed=fs.readFileSync('index.html');
          try{
            fs.writeFileSync('index.html',cp.execFileSync('git',['show','576ff9c9453bb24505989b51f59b3f13913ac57a:index.html'],{maxBuffer:32*1024*1024}));
            const result=cp.spawnSync(process.execPath,['test_view.js'],{encoding:'utf8'});
            console.log('変更前の同条件の検査:',result.status);console.log(result.stdout);
          }finally{fs.writeFileSync('index.html',changed);}
          JS
      - name: ブラウザの確認
        run: google-chrome --version
      - name: 開放戦場の挙動
        run: node test_frontline.js
      - name: 開放戦場の操作と撮影
        run: node test_frontline_browser.js
      - name: 既存のリリースゲート
        run: node tool_release.js
      - name: 画面を保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontline-screenshots
          path: test-output/frontline-*.png
          if-no-files-found: ignore
